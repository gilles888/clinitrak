<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title ?: 'Document CliniTrak'}">Document CliniTrak</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 11pt;
            color: #333;
            margin: 40px;
        }
        .header {
            border-bottom: 2px solid #1a5276;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #1a5276;
            font-size: 18pt;
        }
        .header .subtitle {
            color: #666;
            font-size: 10pt;
        }
        .content {
            margin-top: 20px;
        }
        .footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 8pt;
            color: #999;
            border-top: 1px solid #ddd;
            padding-top: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>CliniTrak</h1>
        <div class="subtitle">Plateforme de gestion de la recherche clinique hospitalière</div>
    </div>
    <div class="content">
        <h2 th:text="${title ?: 'Document'}">Document</h2>
        <p th:text="${content ?: ''}"></p>
    </div>
    <div class="footer">
        Document généré automatiquement par CliniTrak — Confidentiel
    </div>
</body>
</html>
