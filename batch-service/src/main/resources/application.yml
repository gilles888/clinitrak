server:
  port: 8089

spring:
  application:
    name: batch-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${BATCH_DB_NAME:clinitrak_batch}
    username: ${DB_USERNAME:clinitrak}
    password: ${DB_PASSWORD:clinitrak}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false   # Désactive l'exécution automatique au démarrage

clinitrak:
  security:
    jwt:
      secret: ${JWT_SECRET:changeme-clinitrak-secret-key-must-be-at-least-256-bits-long}
  services:
    notification-service:
      url: ${NOTIFICATION_SERVICE_URL:http://localhost:8090}
    pharmacy-service:
      url: ${PHARMACY_SERVICE_URL:http://localhost:8085}

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,batch

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
