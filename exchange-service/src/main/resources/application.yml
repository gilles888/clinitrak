server:
  port: 8086

spring:
  application:
    name: exchange-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${EXCHANGE_DB_NAME:clinitrak_exchange}
    username: ${DB_USERNAME:clinitrak}
    password: ${DB_PASSWORD:clinitrak}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

clinitrak:
  security:
    jwt:
      secret: ${JWT_SECRET:changeme-clinitrak-secret-key-must-be-at-least-256-bits-long}
      external-secret: ${EXCHANGE_JWT_SECRET:changeme-exchange-secret-key-must-be-at-least-256-bits-long}
  tenant:
    root-domain: ${ROOT_DOMAIN:clinitrak.be}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
