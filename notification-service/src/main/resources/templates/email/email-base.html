<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${subject ?: 'Notification CliniTrak'}">Notification CliniTrak</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: #333333;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .email-wrapper {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .email-header {
            background-color: #1a5276;
            color: #ffffff;
            padding: 24px 32px;
        }
        .email-header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }
        .email-header .tagline {
            margin: 4px 0 0;
            font-size: 12px;
            opacity: 0.8;
        }
        .email-body {
            padding: 32px;
        }
        .email-body h2 {
            color: #1a5276;
            font-size: 18px;
            margin-top: 0;
        }
        .email-footer {
            background-color: #f8f9fa;
            border-top: 1px solid #e9ecef;
            padding: 16px 32px;
            text-align: center;
            font-size: 11px;
            color: #999999;
        }
        .btn {
            display: inline-block;
            padding: 10px 24px;
            background-color: #1a5276;
            color: #ffffff;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            margin-top: 16px;
        }
        .alert-box {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px 16px;
            margin: 16px 0;
            border-radius: 0 4px 4px 0;
        }
        .info-box {
            background-color: #d1ecf1;
            border-left: 4px solid #17a2b8;
            padding: 12px 16px;
            margin: 16px 0;
            border-radius: 0 4px 4px 0;
        }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <!-- En-tête -->
        <div class="email-header">
            <h1>CliniTrak</h1>
            <p class="tagline">Plateforme de gestion de la recherche clinique hospitalière</p>
        </div>

        <!-- Corps dynamique -->
        <div class="email-body" th:fragment="body">
            <!-- Contenu surchargé par les templates fils -->
        </div>

        <!-- Pied de page -->
        <div class="email-footer">
            <p>Ce message est généré automatiquement par la plateforme CliniTrak. Ne pas répondre à cet email.</p>
            <p>&copy; 2026 CliniTrak — Confidentiel</p>
        </div>
    </div>
</body>
</html>
