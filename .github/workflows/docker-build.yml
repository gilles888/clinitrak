name: Docker Build & Push

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/clinitrak

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - { name: auth-service, port: 8081 }
          - { name: study-service, port: 8082 }
          - { name: ethics-service, port: 8083 }
          - { name: ctc-service, port: 8084 }
          - { name: pharmacy-service, port: 8085 }
          - { name: exchange-service, port: 8086 }
          - { name: document-service, port: 8088 }
          - { name: batch-service, port: 8089 }
          - { name: notification-service, port: 8090 }
          - { name: admin-service, port: 8091 }
          - { name: gateway, port: 8080 }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service.name }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:latest
