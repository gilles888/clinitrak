spring:
  application:
    name: auth-service

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate          # Liquibase gère le schéma — Hibernate ne modifie rien
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 20

  # Liquibase
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

# Server
server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# CliniTrak custom properties
clinitrak:
  security:
    jwt:
      secret: ${JWT_SECRET:TW91dmlzLXRlc3QtY2xpbml0cmFrLXNlY3JldC1rZXktbXVzdC1iZS1hdC1sZWFzdC0zMi1ieXRlcw==}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}     # 15 min
  tenant:
    root-domain: ${CLINITRAK_ROOT_DOMAIN:clinitrak.be}
  cors:
    allowed-origins:
      - ${CORS_ORIGIN_1:http://localhost:4200}

---
# Profil DEV
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clinitrak_auth}
    username: ${DB_USER:clinitrak}
    password: ${DB_PASSWORD:clinitrak_dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    show-sql: true

logging:
  level:
    be.clinitrak: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

---
# Profil STAGING
spring:
  config:
    activate:
      on-profile: staging

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:clinitrak_auth}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

logging:
  level:
    be.clinitrak: INFO
    org.springframework.security: WARN

---
# Profil PROD
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000

logging:
  level:
    be.clinitrak: WARN
    org.springframework.security: ERROR
